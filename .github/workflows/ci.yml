name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t media-free-browser:ci .

      - name: Boot it and check health
        run: |
          docker run -d --name mfb -p 8080:8080 media-free-browser:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              echo "healthy"
              exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy"
          docker logs mfb
          exit 1
